# Dev-only credentials. Never reuse these in production.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: admin_starter
      MYSQL_USER: admin_starter
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"   # 3307 on the host so it doesn't clash with a local MySQL
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

volumes:
  mysql_data: